name: opc-test

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: opc-backend:${IMAGE_TAG:?Set IMAGE_TAG}
  build:
    context: ..
    dockerfile: BackendService/Dockerfile
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=256m,mode=1777"]
  pids_limit: 256
  mem_limit: 1400m
  cpus: 1.5
  logging: *logging
  environment:
    OPC_PG_DATABASE: ${DATABASE_NAME:-opc_test}

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-admin
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --auth-host=scram-sha-256
      TZ: UTC
    secrets: [pg-admin]
    volumes:
      - pg-data:/var/lib/postgresql
    command: [postgres, -c, max_connections=40, -c, shared_buffers=128MB, -c, password_encryption=scram-sha-256]
    shm_size: 128m
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      database: {ipv4_address: 172.30.1.3}
    logging: *logging

  backend:
    <<: *backend
    environment:
      OPC_PG_DATABASE: ${DATABASE_NAME:-opc_test}
      OPC_HALL_AUDIENCE: internal
      OPC_ASSIGNMENT_MODE: disabled
      OPC_DOCS_ENABLED: "false"
      OPC_CORS_ORIGINS: '["${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}"]'
      OPC_PREVIEW_TIMEOUT_SECONDS: "60"
    secrets: [pg-app]
    volumes:
      - ${FILES_ROOT:-${DATA_ROOT:?Set DATA_ROOT}/files}:/var/lib/opc/files
      - ${DATA_ROOT}/previews:/var/lib/opc/previews
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      edge: {ipv4_address: 172.30.0.4}
      database: {ipv4_address: 172.30.1.2}

  admin:
    image: opc-admin:${ADMIN_IMAGE_TAG:-${IMAGE_TAG:?Set IMAGE_TAG}}
    build:
      context: ../FrontendAdmin
      args:
        VITE_API_BASE_URL: ${ADMIN_PUBLIC_ORIGIN:-${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}}
        VITE_PUBLIC_BASE: /
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      edge: {ipv4_address: 172.30.0.3}
    logging: *logging

  website:
    image: opc-website:${WEBSITE_IMAGE_TAG:-${IMAGE_TAG:?Set IMAGE_TAG}}
    build:
      context: ../Website
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      edge: {ipv4_address: 172.30.0.5}
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    read_only: true
    tmpfs: [/var/cache/nginx:size=64m, /var/run:size=1m]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/opc_proxy_params:ro
      - ./nginx/api_locations:/etc/nginx/opc_api_locations:ro
      - ${DATA_ROOT}/letsencrypt:/etc/letsencrypt:ro
      - ${DATA_ROOT}/acme:/var/www/acme:ro
    depends_on:
      backend: {condition: service_healthy}
      admin: {condition: service_healthy}
      website: {condition: service_healthy}
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/nginx-health]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      edge: {ipv4_address: 172.30.0.2}
    logging: *logging

  migrate:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: [python, -m, deployment.initialize]
    secrets: [pg-admin, pg-app, bootstrap-admin]
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}

secrets:
  pg-admin: {file: "${DATA_ROOT}/secrets/pg-admin"}
  pg-app: {file: "${DATA_ROOT}/secrets/pg-app"}
  bootstrap-admin: {file: "${DATA_ROOT}/secrets/admin-login.json"}

volumes:
  pg-data:
    name: opc-test-pg18-data

networks:
  edge:
    ipam:
      config: [{subnet: 172.30.0.0/28}]
  database:
    internal: true
    ipam:
      config: [{subnet: 172.30.1.0/28}]
