limit_req_zone $binary_remote_addr zone=opc_auth:10m rate=10r/m;
server_tokens off;
client_max_body_size 26m;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
server {
    listen 80 default_server;
    server_name _;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    http2 on;
    server_name 43.165.191.156;
    ssl_certificate /etc/letsencrypt/live/opc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    include /etc/nginx/opc_api_locations;
    location = /admin { return 308 https://admin.opcapp.art/; }
    location /admin/ { return 308 https://admin.opcapp.art/; }
    location / { return 308 https://www.opcapp.art$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.opcapp.art;
    ssl_certificate /etc/letsencrypt/live/opc-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opc-domains/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    location ~ /\. { return 404; }
    location = /admin { return 308 https://admin.opcapp.art/; }
    location /admin/ { return 308 https://admin.opcapp.art/; }
    location / {
        include /etc/nginx/opc_proxy_params;
        proxy_pass http://website:8080;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name admin.opcapp.art;
    ssl_certificate /etc/letsencrypt/live/opc-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opc-domains/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/opc_api_locations;
    location / {
        include /etc/nginx/opc_proxy_params;
        proxy_pass http://admin:8080;
    }
}
