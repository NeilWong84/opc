[project]
name = "opc-backend"
version = "0.1.0"
description = "OPC 日本国内开发服务统一后端"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "psycopg[binary]", "pydantic-settings", "argon2-cffi", "python-multipart", "email-validator"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: isolated real PostgreSQL tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
