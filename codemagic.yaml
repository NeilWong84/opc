# Manual first-pass compilation. No signing identities or publishing are configured.
workflows:
  opc-ios-unsigned:
    name: OPC iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: APPClient
    environment:
      flutter: 3.35.5
      xcode: "26.3"
      cocoapods: 1.16.2
      vars:
        OPC_API_BASE_URL: "https://43.165.191.156/"
    scripts:
      - name: Record build environment
        script: |
          set -euo pipefail
          mkdir -p build/ci
          {
            flutter --version
            xcodebuild -version
            pod --version
            git rev-parse HEAD
          } 2>&1 | tee build/ci/environment.log
      - name: Restore locked dependencies and localization
        script: |
          set -euo pipefail
          flutter precache --ios 2>&1 | tee build/ci/precache.log
          flutter pub get --enforce-lockfile 2>&1 | tee build/ci/pub-get.log
          python3 tool/merge_l10n.py
          flutter gen-l10n
      - name: Analyze Dart code
        script: |
          set -euo pipefail
          flutter analyze --no-pub 2>&1 | tee build/ci/analyze.log
      - name: Run Dart and widget tests
        script: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee build/ci/tests.log
      - name: Install iOS native dependencies
        script: |
          set -euo pipefail
          (cd ios && pod install) 2>&1 | tee build/ci/pods.log
      - name: Compile unsigned iOS release
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub \
            --target=lib/main.dart \
            --dart-define=APP_ENV=api \
            --dart-define="OPC_API_BASE_URL=$OPC_API_BASE_URL" \
            2>&1 | tee build/ci/ios-build.log
      - name: Package unsigned app for download
        script: |
          set -euo pipefail
          test -f build/ios/iphoneos/Runner.app/Runner
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/ci/OPC-ios-unsigned.app.zip
          shasum -a 256 build/ci/OPC-ios-unsigned.app.zip > build/ci/SHA256SUMS.txt
          cp ios/Podfile.lock build/ci/Podfile.lock
    artifacts:
      - APPClient/build/ci/*.log
      - APPClient/build/ci/*.zip
      - APPClient/build/ci/SHA256SUMS.txt
      - APPClient/build/ci/Podfile.lock
      - /tmp/xcodebuild_logs/*.log
