<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OPC Admin</title>
    <script>
      // Apply the official TDesign selector before first paint; no custom palette.
      try {
        const mode = localStorage.getItem('opc.admin.theme') || 'light';
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('theme-mode', 'dark');
      } catch (_) { /* Storage may be unavailable in private browsing. */ }
    </script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
